name: interface

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · format · unit · build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: {node-version-file: .nvmrc, cache: pnpm}

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      # lib/api-routes.test.ts holds /docs/api to docs/15-api.md, which lives
      # in pactora-docs-near. Only that file, outside the tree lint and tests
      # walk. raw.githubusercontent.com serves it only while that repo is
      # public; while it is private this step needs a token with read access.
      - run: >-
          curl -fsSL --create-dirs -o "$RUNNER_TEMP/pactora-docs-near/docs/15-api.md"
          https://raw.githubusercontent.com/gopaltalaviya/pactora-docs-near/master/docs/15-api.md
      - run: pnpm test
        env:
          PACTORA_DOCS_DIR: ${{ runner.temp }}/pactora-docs-near
      - run: pnpm audit --prod --audit-level high

      # A production build without NEXT_PUBLIC_API_URL fails on purpose (it
      # would ship a site that talks to localhost), so CI names one.
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid

  smoke:
    name: smoke (Playwright, mocked API)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: {node-version-file: .nvmrc, cache: pnpm}

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # `pnpm check:contract` is deliberately NOT here. It asks a RUNNING API
  # whether every field this repo reads still exists, which is exactly what
  # makes it worth having — and it means it belongs against a deployed
  # environment, not against a CI job with no server to ask. Running it here
  # would only be able to assert that it fails to connect.
